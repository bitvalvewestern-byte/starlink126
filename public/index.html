<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Fee Payment - RefurbTech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        
        .payment-card {
            max-width: 460px;
            width: 100%;
            border-radius: 1.2rem;
            box-shadow: 0 15px 40px rgba(0, 0, 0, .35);
        }
        
        .brand-icon {
            font-size: 3rem;
            color: #2a5298;
        }
        
        .btn-pay {
            padding: 0.9rem;
            font-size: 1.05rem;
            border-radius: 0.7rem;
        }
        
        .btn-mpesa {
            background-color: #28a745;
            color: #fff;
        }
        
        .btn-mpesa:hover {
            background-color: #218838;
            color: #fff;
        }
        
        .btn-card {
            background-color: #1e3c72;
            color: #fff;
        }
        
        .btn-card:hover {
            background-color: #2a5298;
            color: #fff;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card payment-card mx-auto">
            <div class="card-body p-4 p-md-5 text-center">
                <i class="bi bi-laptop brand-icon"></i>
                <h3 class="fw-bold mt-2">RefurbTech</h3>
                <p class="text-muted mb-1">Refurbished Electronics Delivery</p>
                <hr>
                <h5 class="mt-3 mb-4">Choose your payment method for the delivery fee</h5>

                <div class="d-grid gap-3">
                    <a href="mpesa.html" class="btn btn-mpesa btn-pay">
                        <i class="bi bi-phone-fill me-2"></i>Pay with M-Pesa
                    </a>
                    <a href="login.html" class="btn btn-card btn-pay">
                        <i class="bi bi-credit-card-fill me-2"></i>Pay with Credit Card
                    </a>
                </div>

                <p class="text-muted small mt-4 mb-0">
                    <i class="bi bi-shield-lock me-1"></i>Secure &amp; encrypted payment
                </p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
